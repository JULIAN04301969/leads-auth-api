<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Sistema de Gestión Integral de Leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0b0f1a;
      --surface:  #111827;
      --surface2: #1c2537;
      --border:   #1e2d45;
      --accent:   #00c896;
      --accent2:  #0ea5e9;
      --danger:   #f43f5e;
      --text:     #e2e8f0;
      --muted:    #64748b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .logo {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,150,0.15);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0b0f1a;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider { height: 1px; background: var(--border); }

    .status {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.ok  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.err { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }

    .response {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      max-height: 200px;
      overflow-y: auto;
    }

    .response.ok  { border-color: var(--accent); color: var(--accent); }
    .response.err { border-color: var(--danger);  color: var(--danger); }

    .token-box {
      background: var(--surface2);
      border: 1px solid var(--accent2);
      border-radius: 6px;
      padding: 10px 14px;
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      color: var(--accent2);
      word-break: break-all;
      display: none;
    }

    .link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo">GA7-220501096-AA5-EV01</div>
  <h1>Iniciar sesión</h1>
  <p class="subtitle">Sistema de Gestión Integral de Leads</p>

  <div class="card">

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" />
    </div>

    <button class="btn" onclick="iniciarSesion()">Iniciar sesión</button>

    <div class="divider"></div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="estado">En espera de solicitud</span>
    </div>

    <div class="response" id="respuesta">// La respuesta del servidor aparecerá aquí</div>

    <div class="token-box" id="tokenBox"></div>

    <div class="divider"></div>

    <p class="link">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>

  </div>

  <script>
    const API = '/api';

    async function iniciarSesion() {
      const btn = document.querySelector('.btn');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      const body = {
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body)
        });
        const data = await res.json();
        mostrar(data, res.ok);

        // Si la autenticación fue satisfactoria, mostrar el token JWT generado
        if (res.ok && data.token) {
          const box = document.getElementById('tokenBox');
          box.style.display = 'block';
          box.textContent   = `Token JWT:\n${data.token}`;
        }

      } catch (err) {
        mostrar({ error: 'No se pudo conectar con el servidor.', detalle: err.message }, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    }

    function mostrar(data, ok) {
      document.getElementById('respuesta').textContent = JSON.stringify(data, null, 2);
      document.getElementById('respuesta').className  = `response ${ok ? 'ok' : 'err'}`;
      document.getElementById('dot').className        = `dot ${ok ? 'ok' : 'err'}`;
      document.getElementById('estado').textContent   = ok
        ? '✅ Autenticación satisfactoria.'
        : '❌ Error en la autenticación.';
    }
  </script>

</body>
</html>
