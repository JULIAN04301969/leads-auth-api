<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Sistema de Gestión Integral de Leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0b0f1a;
      --surface:  #111827;
      --surface2: #1c2537;
      --border:   #1e2d45;
      --accent:   #00c896;
      --danger:   #f43f5e;
      --text:     #e2e8f0;
      --muted:    #64748b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .logo {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      text-align: center;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 36px;
      text-align: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input, select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,200,150,0.15);
    }

    select option { background: var(--surface2); }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0b0f1a;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .divider { height: 1px; background: var(--border); }

    .status {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .dot.ok  { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
    .dot.err { background: var(--danger);  box-shadow: 0 0 6px var(--danger); }

    .response {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.7;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      max-height: 200px;
      overflow-y: auto;
    }

    .response.ok  { border-color: var(--accent); color: var(--accent); }
    .response.err { border-color: var(--danger);  color: var(--danger); }

    .link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="logo">GA7-220501096-AA5-EV01</div>
  <h1>Crear cuenta</h1>
  <p class="subtitle">Sistema de Gestión Integral de Leads</p>

  <div class="card">

    <div class="field">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" placeholder="Ej. Juan Pérez" autocomplete="name" />
    </div>

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" placeholder="correo@ejemplo.com" autocomplete="email" />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
    </div>

    <div class="field">
      <label for="rol">Rol en el sistema</label>
      <select id="rol">
        <option value="asesor">Asesor</option>
        <option value="supervisor">Supervisor</option>
        <option value="admin">Administrador</option>
      </select>
    </div>

    <button class="btn" onclick="registrar()">Crear cuenta</button>

    <div class="divider"></div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="estado">En espera de solicitud</span>
    </div>

    <div class="response" id="respuesta">// La respuesta del servidor aparecerá aquí</div>

    <div class="divider"></div>

    <p class="link">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>

  </div>

  <script>
    const API = '/api';

    async function registrar() {
      const btn = document.querySelector('.btn');
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      const body = {
        nombre:   document.getElementById('nombre').value.trim(),
        email:    document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        rol:      document.getElementById('rol').value
      };

      try {
        const res  = await fetch(`${API}/auth/registro`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify(body)
        });
        const data = await res.json();
        mostrar(data, res.ok);

        // Si el registro fue exitoso, redirigir al login después de 2 segundos
        if (res.ok) {
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        }

      } catch (err) {
        mostrar({ error: 'No se pudo conectar con el servidor.', detalle: err.message }, false);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    }

    function mostrar(data, ok) {
      document.getElementById('respuesta').textContent = JSON.stringify(data, null, 2);
      document.getElementById('respuesta').className  = `response ${ok ? 'ok' : 'err'}`;
      document.getElementById('dot').className        = `dot ${ok ? 'ok' : 'err'}`;
      document.getElementById('estado').textContent   = ok
        ? 'Usuario registrado. Redirigiendo al login...'
        : 'Error en el registro';
    }
  </script>

</body>
</html>
